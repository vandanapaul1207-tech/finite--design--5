<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finite by Design</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;background:#0a0704;color:#f0e6c8;font-family:'Inter',sans-serif;overflow-x:hidden}

@keyframes flicker{0%,100%{transform:scaleX(1) scaleY(1)}33%{transform:scaleX(0.9) scaleY(1.08)}66%{transform:scaleX(1.06) scaleY(0.94)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounceUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes waveBar{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}

/* PAGES */
.page{display:none;width:100%;min-height:100vh}
.page.active{display:flex;flex-direction:column;animation:fadeIn 0.5s ease}

/* ── LANDING ── */
#pg-landing{align-items:center;justify-content:flex-start;padding:2.5rem 1.5rem 2rem;background:#0a0704}
.brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#5a4a2a;margin-bottom:1.2rem;animation:slideUp 0.6s ease both}
.main-title{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;line-height:1.1;text-align:center;color:#f0e6c8;margin-bottom:0.4rem;animation:slideUp 0.6s 0.1s ease both}
.main-sub{font-size:13px;color:#8a7a5a;letter-spacing:0.05em;text-align:center;margin-bottom:2rem;animation:slideUp 0.6s 0.2s ease both}

.sec-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#5a4a2a;margin-bottom:0.9rem;text-align:center}
.candle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:100%;max-width:700px;margin-bottom:2rem;animation:slideUp 0.6s 0.3s ease both}
.c-card{cursor:pointer;background:#0f0c07;border:0.5px solid #2a1e0a;border-radius:12px;padding:1.25rem 1rem 1rem;text-align:center;transition:border-color 0.25s,background 0.25s,transform 0.25s}
.c-card:hover{border-color:#c8902a;transform:translateY(-3px)}
.c-card.chosen{border-color:#c8902a;background:#1a1208;box-shadow:0 0 18px rgba(200,144,42,0.15)}
.c-flame-area{height:72px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.c-name{font-family:'Cormorant Garamond',serif;font-size:12px;color:#c8902a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.c-ganglion{font-size:11px;color:#5a4a2a;line-height:1.4}
.c-wave{display:flex;gap:2px;align-items:center;justify-content:center;height:12px;margin-bottom:6px}
.c-wave span{width:2px;border-radius:1px;opacity:0.5;transform-origin:center}

.avatar-grid{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.75rem;animation:slideUp 0.6s 0.4s ease both;width:100%;max-width:700px}
.av-card{cursor:pointer;background:#0f0c07;border:0.5px solid #2a1e0a;border-radius:10px;padding:0.9rem 0.75rem 0.7rem;text-align:center;transition:all 0.25s;width:104px;flex-shrink:0}
.av-card:hover{border-color:#c8902a;transform:translateY(-2px)}
.av-card.chosen{border-color:#c8902a;background:#1a1208}
.av-label{font-size:10px;color:#8a7a5a;margin-top:5px;line-height:1.4}

.start-btn{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:0.1em;background:#c8902a;color:#0a0704;border:none;padding:14px 52px;border-radius:5px;cursor:pointer;transition:all 0.25s;animation:slideUp 0.6s 0.5s ease both;font-weight:600}
.start-btn:hover{background:#e0a030;transform:scale(1.02)}
.start-btn:disabled{background:#2a1e0a;color:#4a3a1a;cursor:not-allowed;transform:none}

/* ── GAME ── */
#pg-game{flex-direction:column;background:#0a0704}
.g-header{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1.4rem;border-bottom:0.5px solid #1a1208;background:#0a0704;flex-shrink:0}
.g-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:#c8902a;letter-spacing:0.05em}
.g-right-header{display:flex;align-items:center;gap:14px}
.flame-wrap{display:flex;align-items:center;gap:7px}
.flame-bar-bg{width:110px;height:6px;background:#1a1208;border-radius:3px;overflow:hidden;border:0.5px solid #2a1e0a}
.flame-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease,background 0.5s}
.flame-pct{font-size:11px;color:#8a7a5a;min-width:30px;text-align:right}
.music-btn{background:transparent;border:0.5px solid #3a2e1a;color:#8a7a5a;padding:5px 11px;font-size:11px;cursor:pointer;border-radius:4px;transition:all 0.2s;letter-spacing:0.04em}
.music-btn:hover{border-color:#c8902a;color:#c8902a}

.g-body{display:flex;flex:1;overflow:hidden;height:calc(100vh - 52px)}

/* Left panel */
.g-left{width:250px;flex-shrink:0;background:#0f0c07;border-right:0.5px solid #1a1208;padding:1.2rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
.av-display{text-align:center;min-height:105px;display:flex;align-items:center;justify-content:center}
.prog-label{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#3a2e1a;margin-bottom:7px;text-align:center}
.prog-dots{display:flex;gap:9px;justify-content:center}
.p-dot{width:9px;height:9px;border-radius:50%;background:#1a1208;border:0.5px solid #2a1e0a;transition:all 0.4s}
.p-dot.done{background:#c8902a;border-color:#c8902a}
.p-dot.curr{background:#f0c060;border-color:#f0c060;box-shadow:0 0 7px rgba(240,192,96,0.5)}
.step-box{background:#13100a;border-radius:9px;padding:1rem;border:0.5px solid #1a1208}
.step-tag{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#c8902a;margin-bottom:5px}
.step-desc{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:#c8b080;line-height:1.6;margin-bottom:7px}
.step-fact{font-size:11px;color:#5a4a2a;line-height:1.6;border-left:2px solid #2a1e0a;padding-left:7px}

/* Center panel */
.g-center{flex:1;position:relative;overflow:hidden;background:#0a0704}
.anat-bg{position:absolute;inset:0;transition:opacity 0.7s ease;display:flex;align-items:center;justify-content:center}
.anat-bg svg{width:100%;height:100%;max-height:100%}
.timer-ring{position:absolute;top:14px;right:14px;z-index:2}
.live-candle{position:absolute;bottom:16px;right:16px;z-index:2;filter:drop-shadow(0 0 10px rgba(200,144,42,0.35))}

/* Rescue */
.rescue-overlay{position:absolute;inset:0;background:rgba(4,2,1,0.95);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.rescue-overlay.show{display:flex;animation:fadeIn 0.4s ease}
.rescue-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;height:380px;background:radial-gradient(circle,rgba(200,144,42,0.1) 0%,transparent 70%);pointer-events:none;animation:pulse 2.5s ease infinite}
.rescue-h{font-family:'Cormorant Garamond',serif;font-size:26px;color:#f0c060;margin-bottom:0.4rem;position:relative}
.rescue-sub{font-size:13px;color:#8a7a5a;margin-bottom:1.25rem;line-height:1.6;position:relative}
.rescue-q{font-family:'Cormorant Garamond',serif;font-size:19px;color:#f0e6c8;margin-bottom:1.1rem;line-height:1.55;max-width:480px;position:relative}
.rescue-opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:460px;position:relative}
.rescue-opt{cursor:pointer;border:0.5px solid #2a1e0a;border-radius:9px;padding:13px 16px;background:#13100a;color:#c8a060;font-size:14px;font-family:'Inter',sans-serif;text-align:left;transition:all 0.22s;width:100%}
.rescue-opt:hover{border-color:#c8902a;color:#f0e6c8}
.rescue-opt.correct{border-color:#4aaa4a;background:#061806;color:#7adc7a;cursor:default}
.rescue-opt.wrong{border-color:#aa3a2a;background:#180604;color:#dc7a6a;cursor:default}
.rescue-fb{font-size:13px;color:#8adc8a;margin-top:10px;line-height:1.6;position:relative;min-height:18px}
.rescue-cont{font-family:'Cormorant Garamond',serif;font-size:15px;margin-top:14px;background:#c8902a;color:#0a0704;border:none;padding:11px 30px;border-radius:4px;cursor:pointer;display:none;position:relative;transition:background 0.2s}
.rescue-cont:hover{background:#e0a030}

/* Right panel */
.g-right{width:310px;flex-shrink:0;background:#0f0c07;border-left:0.5px solid #1a1208;padding:1.4rem;display:flex;flex-direction:column;gap:0.9rem;overflow-y:auto}
.q-tag{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#8a7a5a}
.q-text{font-family:'Cormorant Garamond',serif;font-size:19px;color:#f0e6c8;line-height:1.55}
.ans-list{display:flex;flex-direction:column;gap:9px}
.ans-btn{cursor:pointer;border:0.5px solid #2a1e0a;border-radius:9px;padding:13px 16px;background:#13100a;color:#c8a060;font-size:14px;font-family:'Inter',sans-serif;text-align:left;transition:all 0.22s;line-height:1.5;width:100%}
.ans-btn:hover{border-color:#c8902a;color:#f0e6c8;transform:translateX(3px)}
.ans-btn.correct{border-color:#4aaa4a;background:#061806;color:#7adc7a;transform:none;cursor:default}
.ans-btn.wrong{border-color:#aa3a2a;background:#180604;color:#dc7a6a;opacity:0.75;cursor:default;transform:none}
.ans-btn:disabled{cursor:default}
.fb-box{font-size:13px;line-height:1.65;padding:11px 13px;border-radius:8px}
.fb-box.good{background:#061806;color:#6acc6a;border:0.5px solid #1a4a1a;animation:slideUp 0.3s ease}
.fb-box.bad{background:#180604;color:#cc6a5a;border:0.5px solid #4a1a10;animation:slideUp 0.3s ease}
.next-btn{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:0.05em;background:transparent;border:0.5px solid #c8902a;color:#c8902a;padding:11px 18px;border-radius:5px;cursor:pointer;width:100%;transition:all 0.25s;display:none}
.next-btn:hover{background:#c8902a;color:#0a0704}

/* ── END ── */
#pg-end{align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;background:#0a0704}
.end-brand{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:#3a2e1a;margin-bottom:0.9rem}
.end-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:#f0e6c8;margin-bottom:0.25rem}
.end-sub{font-size:13px;color:#8a7a5a;margin-bottom:1.25rem}
.end-score{font-family:'Cormorant Garamond',serif;font-size:68px;color:#c8902a;font-weight:300;line-height:1}
.end-score-lbl{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#3a2e1a;margin-bottom:1.75rem}
.end-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;margin-bottom:1.75rem}
.end-card{background:#0f0c07;border:0.5px solid #2a1e0a;border-radius:9px;padding:14px;text-align:left;opacity:0;animation:cardIn 0.5s ease forwards}
.end-card-g{font-size:10px;color:#c8902a;letter-spacing:0.09em;text-transform:uppercase;margin-bottom:5px}
.end-card-e{font-size:12px;color:#5a4a2a;line-height:1.55}
.share-box{font-size:12px;color:#5a4a2a;background:#0f0c07;border:0.5px solid #2a1e0a;border-radius:6px;padding:10px 15px;margin-bottom:1.4rem;cursor:pointer;max-width:460px;line-height:1.6;transition:border-color 0.2s;user-select:none}
.share-box:hover{border-color:#c8902a}
.end-btn{font-family:'Cormorant Garamond',serif;font-size:15px;background:transparent;border:0.5px solid #c8902a;color:#c8902a;padding:11px 34px;border-radius:4px;cursor:pointer;transition:all 0.2s}
.end-btn:hover{background:#c8902a;color:#0a0704}

@media(max-width:860px){
  .g-body{flex-direction:column;height:auto;overflow:auto}
  .g-left,.g-right{width:100%;border:none;border-bottom:0.5px solid #1a1208}
  .g-center{min-height:260px}
  .candle-grid{grid-template-columns:repeat(2,1fr)}
  .end-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="pg-landing" class="page active"></div>
<div id="pg-game" class="page"></div>
<div id="pg-end" class="page"></div>

<script>
// ══════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════
function show(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}
function el(id){return document.getElementById(id);}
function ce(tag,cls,html){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html)e.innerHTML=html;
  return e;
}

// ══════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════
var AC=null, musicOn=true, musicNodes=[];
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function stopMusic(){musicNodes.forEach(function(n){try{n.stop();}catch(e){}});musicNodes=[];}

function playAmbient(type){
  stopMusic();
  if(!musicOn)return;
  var ctx=getAC();
  var master=ctx.createGain();master.gain.value=0.13;master.connect(ctx.destination);
  var configs={
    landing:{base:130.8,ratios:[1,1.25,1.5,2],wave:'sine',beat:2.0},
    ciliary:{base:220,ratios:[1,1.122,1.498,1.782],wave:'triangle',beat:1.6},
    pterygopalatine:{base:174.6,ratios:[1,1.189,1.498,2],wave:'sine',beat:2.3},
    submandibular:{base:146.8,ratios:[1,1.122,1.335,1.782],wave:'triangle',beat:1.9},
    otic:{base:110,ratios:[1,1.189,1.498,1.587],wave:'sine',beat:2.8}
  };
  var cfg=configs[type]||configs.landing;
  var drone=ctx.createOscillator();var dg=ctx.createGain();
  drone.type='sine';drone.frequency.value=cfg.base/2;dg.gain.value=0.07;
  drone.connect(dg);dg.connect(master);drone.start();musicNodes.push(drone);
  cfg.ratios.forEach(function(r,i){
    var freq=cfg.base*r;
    for(var k=0;k<16;k++){
      var t=ctx.currentTime+i*0.25+k*cfg.beat*cfg.ratios.length;
      var o=ctx.createOscillator();var g=ctx.createGain();
      o.type=cfg.wave;o.frequency.value=freq;
      o.detune.value=(Math.random()-0.5)*6;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.35);
      g.gain.linearRampToValueAtTime(0,t+cfg.beat*0.85);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+cfg.beat);
      musicNodes.push(o);
    }
  });
}

function playChime(good){
  var ctx=getAC();
  var freqs=good?[880,1108,1320]:[185,155,130];
  freqs.forEach(function(f,i){
    var o=ctx.createOscillator();var g=ctx.createGain();
    o.type=good?'sine':'triangle';o.frequency.value=f;
    var t=ctx.currentTime+i*0.07;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(good?0.22:0.12,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,t+(good?0.8:0.45));
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1);
  });
}

function playDrone(on){
  if(!on){stopMusic();return;}
  var ctx=getAC();var master=ctx.createGain();master.gain.value=0.09;master.connect(ctx.destination);
  [80,84,88].forEach(function(f){
    var o=ctx.createOscillator();var g=ctx.createGain();
    o.type='sawtooth';o.frequency.value=f;g.gain.value=0.14;
    o.connect(g);g.connect(master);o.start();musicNodes.push(o);
  });
}

function toggleMusic(){
  musicOn=!musicOn;
  var btn=el('musicBtn');if(btn)btn.textContent=musicOn?'\u266a On':'\u266a Off';
  if(musicOn)playAmbient(STATE.curCandle>=0?CANDLES[STATE.curCandle].mood:'landing');
  else stopMusic();
}

// ══════════════════════════════════════════
// SVG HELPERS
// ══════════════════════════════════════════
function flameSVG(color,h,animated){
  var cls=animated?' class="flicker-flame"':'';
  return '<svg width="44" height="'+h+'" viewBox="0 0 44 '+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<rect x="15" y="'+(h*0.45)+'" width="14" height="'+(h*0.52)+'" rx="3" fill="#1a1208" stroke="'+color+'" stroke-width="0.8"/>'
    +'<rect x="17" y="'+(h*0.47)+'" width="10" height="'+(h*0.48)+'" rx="2" fill="#0d0a06"/>'
    +'<line x1="22" y1="'+(h*0.45)+'" x2="22" y2="'+(h*0.34)+'" stroke="#6a5a3a" stroke-width="1.3"/>'
    +'<ellipse cx="22" cy="'+(h*0.28)+'" rx="6" ry="8"'+cls+' fill="'+color+'" opacity="0.9"/>'
    +'<ellipse cx="22" cy="'+(h*0.23)+'" rx="3" ry="4"'+cls+' fill="#fffae0" opacity="0.7"/>'
    +'<ellipse cx="21.5" cy="'+(h*0.21)+'" rx="1.5" ry="2" fill="white" opacity="0.4"/>'
    +'</svg>';
}

function liveFlame(color,health){
  var fh=Math.max(5,health*14);var fw=Math.max(4,health*9);
  var gc=health>0.5?color:health>0.25?'#aa6010':'#880000';
  return '<svg width="44" height="100" viewBox="0 0 44 100">'
    +'<rect x="14" y="38" width="16" height="56" rx="3" fill="#1a1208" stroke="'+gc+'" stroke-width="0.8"/>'
    +'<rect x="16" y="40" width="12" height="52" rx="2" fill="#0d0a06"/>'
    +'<line x1="22" y1="38" x2="22" y2="30" stroke="#6a5a3a" stroke-width="1.3"/>'
    +'<ellipse cx="22" cy="'+(30-fh)+'" rx="'+(fw/2)+'" ry="'+fh+'" fill="'+gc+'" opacity="0.9" class="flicker-flame"/>'
    +'<ellipse cx="22" cy="'+(28-fh)+'" rx="'+(fw/3)+'" ry="'+(fh*0.6)+'" fill="#fffae0" opacity="0.7" class="flicker-flame"/>'
    +'<style>.flicker-flame{transform-origin:bottom center;animation:flicker 1.9s ease-in-out infinite}</style>'
    +'</svg>';
}

// ══════════════════════════════════════════
// AVATAR SVGs (inline, detailed)
// ══════════════════════════════════════════
function avBoy(sz){sz=sz||90;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 90 90">'
  +'<circle cx="45" cy="24" r="17" fill="#f4c9a0" stroke="#d4a070" stroke-width="0.5"/>'
  +'<path d="M28 18 Q45 8 62 18 Q64 26 62 30 Q45 38 28 30 Q26 26 28 18Z" fill="#2a1a0a" opacity="0.8"/>'
  +'<circle cx="38" cy="25" r="2.5" fill="#1a0a00"/><circle cx="52" cy="25" r="2.5" fill="#1a0a00"/>'
  +'<path d="M40 31 Q45 35 50 31" fill="none" stroke="#8a5a3a" stroke-width="1.2" stroke-linecap="round"/>'
  +'<rect x="28" y="41" width="34" height="29" rx="6" fill="#1a3a6a"/>'
  +'<text x="45" y="59" text-anchor="middle" font-size="8" fill="#6ab0f0" font-family="Inter">MED</text>'
  +'<line x1="28" y1="49" x2="12" y2="62" stroke="#f4c9a0" stroke-width="5" stroke-linecap="round"/>'
  +'<line x1="62" y1="49" x2="78" y2="62" stroke="#f4c9a0" stroke-width="5" stroke-linecap="round"/>'
  +'<path d="M35 70 Q31 80 29 90" fill="none" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>'
  +'<path d="M55 70 Q59 80 61 90" fill="none" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>'
  +'<circle cx="12" cy="64" r="5" fill="#f4c9a0"/><circle cx="78" cy="64" r="5" fill="#f4c9a0"/>'
  +'</svg>';}

function avGirl(sz){sz=sz||90;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 90 90">'
  +'<path d="M26 20 Q45 6 64 20 Q70 30 66 42 Q56 52 45 52 Q34 52 24 42 Q20 30 26 20Z" fill="#8B2252" opacity="0.85"/>'
  +'<circle cx="45" cy="26" r="17" fill="#f4c9a0" stroke="#d4a070" stroke-width="0.5"/>'

  ],summary:'Submandibular and sublingual salivation (~75% resting saliva). Chorda tympani at risk in middle ear surgery.'},
  {steps:[
    {l:'Origin',d:'You arise from the inferior salivatory nucleus of the medulla — the last of the four cranial parasympathetic nuclei.',

     q:'Which cranial nerve carries your fibres from the medulla?',

    {l:'The foramen',d:'Your route loops through the middle ear as the tympanic plexus, then exits as the lesser petrosal nerve.',
     f:'The lesser petrosal nerve exits near or through the foramen ovale. This anatomical variation (dedicated canal vs foramen ovale itself) is surgically relevant.',
     q:'Through which foramen does the lesser petrosal nerve exit?',

     fb:'Near the foramen ovale — sometimes through a small dedicated canal, sometimes through the ovale itself. Variation exists.',
     wfb:'Petrotympanic fissure carries the chorda tympani. Foramen spinosum carries the middle meningeal artery. The lesser petrosal exits near the foramen ovale.'},
    {l:'The synapse',d:'You arrive below the skull base in the infratemporal fossa, medial to the mandibular nerve.',
     f:'The otic ganglion sits just below the foramen ovale, medial to V3. It is the most inferior of the four head ganglia.',
     q:'The otic ganglion is suspended from which nerve?',
     o:['V2 — maxillary nerve','V3 — mandibular nerve','CN IX itself'],c:1,
     fb:'V3 (mandibular nerve) — the otic ganglion hangs medial to V3 just below the foramen ovale.',
     wfb:'V2 suspends the pterygopalatine ganglion. CN IX is the preganglionic nerve. The otic ganglion is specifically a V3 tributary.'},
    {l:'End organ',d:'Postganglionic fibres ride the auriculotemporal nerve (V3) to the largest salivary gland.',
     f:'Frey\'s syndrome: after parotidectomy, aberrant parasympathetic fibres grow into sweat glands, causing gustatory sweating. Treated with botulinum toxin.',
     q:'What is the target organ and what complication follows aberrant reinnervation?',
     o:['Submandibular gland — xerostomia','Parotid gland — Frey\'s syndrome','Lacrimal gland — dry eye'],c:1,
     fb:'Parotid gland. Frey\'s syndrome = aberrant parasympathetic fibres in sweat glands → sweating/flushing when eating.',
     wfb:'Submandibular gland is the submandibular ganglion\'s territory. Lacrimal is pterygopalatine. Parotid + Frey\'s syndrome = otic ganglion.'}
  ],summary:'Parotid salivation. Frey\'s syndrome (gustatory sweating) after parotidectomy = otic ganglion aberrant reinnervation.'}
];

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
var STATE={
  curCandle:-1, curAvatar:0, curPath:null,
  curStep:0, score:0, totalQ:0,
  answered:false, candleH:1.0,
  rescueUsed:false, rescueIdx:0,
  timerID:null, timeLeft:20
};

// ══════════════════════════════════════════
// LANDING
// ══════════════════════════════════════════
function buildLanding(){
  var L=el('pg-landing');
  L.innerHTML='';

  L.appendChild(ce('div','brand','Finite by Design'));

  var title=ce('div','main-title','Four flames.<br>Four pathways.');
  L.appendChild(title);
  var sub=ce('div','main-sub','Navigate the darkness &mdash; follow the nerve &mdash; reach the end organ');
  L.appendChild(sub);

  L.appendChild(ce('div','sec-label','Choose your pathway'));

  var cg=ce('div','candle-grid');
  CANDLES.forEach(function(c,i){
    var card=ce('div','c-card');
    var bars='';
    for(var b=0;b<7;b++){
      bars+='<span style="height:'+(4+Math.floor(Math.random()*10))+'px;background:'+c.color+';animation:waveBar '+(0.5+Math.random()*0.8).toFixed(2)+'s '+(b*0.08).toFixed(2)+'s ease-in-out infinite alternate"></span>';
    }
    card.innerHTML='<div class="c-flame-area">'+flameSVG(c.color,72,true)+'</div>'
      +'<div class="c-wave">'+bars+'</div>'
      +'<div class="c-name">'+c.name+'</div>'
      +'<div class="c-ganglion">'+c.ganglion+'</div>';
    card.addEventListener('click',function(idx,el){return function(){
      STATE.curCandle=idx;
      document.querySelectorAll('.c-card').forEach(function(x){x.classList.remove('chosen');});
      el.classList.add('chosen');
      document.getElementById('startBtn').disabled=false;
    };}(i,card));
    cg.appendChild(card);
  });
  L.appendChild(cg);

  L.appendChild(ce('div','sec-label','Choose your avatar'));

  var ag=ce('div','avatar-grid');
  AVATARS.forEach(function(a,i){
    var card=ce('div','av-card'+(i===0?' chosen':''));
    card.innerHTML=a.fn(58)+'<div class="av-label">'+a.label+'</div>';
    card.addEventListener('click',function(idx,el){return function(){
      STATE.curAvatar=idx;
      document.querySelectorAll('.av-card').forEach(function(x){x.classList.remove('chosen');});
      el.classList.add('chosen');
    };}(i,card));
    ag.appendChild(card);
  });
  L.appendChild(ag);

  var btn=ce('button','start-btn','Light the candle');
  btn.id='startBtn';
  btn.disabled=true;
  btn.addEventListener('click',startGame);
  L.appendChild(btn);

  playAmbient('landing');
}

// ══════════════════════════════════════════
// GAME
// ══════════════════════════════════════════
function buildGameShell(){
  var G=el('pg-game');
  G.innerHTML=
    '<div class="g-header">'
      +'<div class="g-title" id="gTitle">Pathway</div>'
      +'<div class="g-right-header">'
        +'<div class="flame-wrap">'
          +'<svg width="12" height="18" viewBox="0 0 12 18"><ellipse cx="6" cy="12" rx="4" ry="6" fill="#c8902a" opacity="0.9" style="transform-origin:bottom;animation:flicker 1.8s ease infinite"/><ellipse cx="6" cy="10" rx="2.5" ry="3.5" fill="#f0e060" opacity="0.7" style="transform-origin:bottom;animation:flicker 1.8s 0.3s ease infinite"/></svg>'
          +'<div class="flame-bar-bg"><div class="flame-bar-fill" id="flameFill" style="width:100%;background:#c8902a"></div></div>'
          +'<span class="flame-pct" id="flamePct">100%</span>'
        +'</div>'
        +'<button class="music-btn" id="musicBtn" onclick="toggleMusic()">\u266a On</button>'
      +'</div>'
    +'</div>'
    +'<div class="g-body">'
      +'<div class="g-left">'
        +'<div class="av-display" id="avDisplay"></div>'
        +'<div>'
          +'<div class="prog-label">Progress</div>'
          +'<div class="prog-dots" id="progDots"></div>'
        +'</div>'
        +'<div class="step-box">'
          +'<div class="step-tag" id="stepTag"></div>'
          +'<div class="step-desc" id="stepDesc"></div>'
          +'<div class="step-fact" id="stepFact"></div>'
        +'</div>'
      +'</div>'
      +'<div class="g-center">'
        +'<div class="anat-bg" id="anatBg"></div>'
        +'<div class="timer-ring" id="timerRing">'
          +'<svg width="46" height="46" viewBox="0 0 46 46">'
            +'<circle cx="23" cy="23" r="19" fill="none" stroke="#1a1208" stroke-width="3"/>'
            +'<circle cx="23" cy="23" r="19" fill="none" stroke="#c8902a" stroke-width="3" stroke-dasharray="119.4" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 23 23)" id="timerArc"/>'
            +'<text x="23" y="28" text-anchor="middle" font-size="12" fill="#c8902a" font-family="Inter" id="timerTxt">20</text>'
          +'</svg>'
        +'</div>'
        +'<div class="live-candle" id="liveCandle"></div>'
        +'<div class="rescue-overlay" id="rescueOverlay">'
          +'<div class="rescue-glow"></div>'
          +'<div class="rescue-h">The flame is dying\u2026</div>'
          +'<div class="rescue-sub">Answer this question correctly to relight your candle.</div>'
          +'<div class="rescue-q" id="rescueQ"></div>'
          +'<div class="rescue-opts" id="rescueOpts"></div>'
          +'<div class="rescue-fb" id="rescueFb"></div>'
          +'<button class="rescue-cont" id="rescueCont" onclick="rescueContinue()">Candle relit \u2014 retry the question</button>'
        +'</div>'
      +'</div>'
      +'<div class="g-right">'
        +'<div class="q-tag">Choose your passage</div>'
        +'<div class="q-text" id="qText"></div>'
        +'<div class="ans-list" id="ansList"></div>'
        +'<div id="fbBox"></div>'
        +'<button class="next-btn" id="nextBtn" onclick="nextStep()">Continue deeper \u2192</button>'
      +'</div>'
    +'</div>';
}

function startGame(){
  STATE.curPath=PATHWAYS[STATE.curCandle];
  STATE.curStep=0; STATE.score=0; STATE.totalQ=0;
  STATE.answered=false; STATE.candleH=1.0;
  STATE.rescueUsed=false;
  STATE.rescueIdx=Math.floor(Math.random()*RESCUE.length);

  buildGameShell();
  show('pg-game');

  el('gTitle').textContent=CANDLES[STATE.curCandle].ganglion;
  el('avDisplay').innerHTML=AVATARS[STATE.curAvatar].fn(100);

  buildProg();
  renderStep();
  playAmbient(CANDLES[STATE.curCandle].mood);
}

function buildProg(){
  var d=el('progDots');d.innerHTML='';
  STATE.curPath.steps.forEach(function(_,i){
    var dot=ce('div','p-dot'+(i===0?' curr':''));dot.id='pd'+i;d.appendChild(dot);
  });
}
function updateProg(){
  STATE.curPath.steps.forEach(function(_,i){
    var d=el('pd'+i);if(!d)return;
    d.className='p-dot'+(i<STATE.curStep?'done':i===STATE.curStep?' curr':'');
  });
}

function renderStep(){
  clearTimer();
  var s=STATE.curPath.steps[STATE.curStep];
  el('stepTag').textContent=s.l;
  el('stepDesc').textContent=s.d;
  el('stepFact').textContent=s.f;
  el('qText').textContent=s.q;
  el('fbBox').innerHTML='';
  el('nextBtn').style.display='none';
  STATE.answered=false;

  // crossfade anatomical bg
  var bg=el('anatBg');
  bg.style.opacity='0';
  setTimeout(function(){
    bg.innerHTML=BGSRC[STATE.curStep];
    bg.style.opacity='1';
  },280);

  // live candle
  el('liveCandle').innerHTML=liveFlame(CANDLES[STATE.curCandle].color,STATE.candleH);

  // answers with stagger
  var al=el('ansList');al.innerHTML='';
  s.o.forEach(function(opt,i){
    var b=ce('button','ans-btn',opt);
    b.style.animation='slideUp 0.35s '+(i*0.09)+'s ease both';
    b.style.opacity='0';
    setTimeout(function(){b.style.opacity='';},50);
    b.addEventListener('click',function(){handleAnswer(i,s,b);});
    al.appendChild(b);
  });

  updateProg();
  startTimer(s);
}

function startTimer(s){
  STATE.timeLeft=20;
  updateTimerUI(20);
  STATE.timerID=setInterval(function(){
    STATE.timeLeft--;
    updateTimerUI(STATE.timeLeft);
    if(STATE.timeLeft<=0){clearTimer();handleAnswer(-1,s,null);}
  },1000);
}
function clearTimer(){if(STATE.timerID){clearInterval(STATE.timerID);STATE.timerID=null;}}
function updateTimerUI(t){
  var arc=el('timerArc'),txt=el('timerTxt');
  if(!arc||!txt)return;
  var offset=119.4*(1-t/20);
  arc.setAttribute('stroke-dashoffset',String(offset));
  var col=t>8?'#c8902a':t>4?'#e06010':'#cc2010';
  arc.setAttribute('stroke',col);
  txt.textContent=String(t);
  txt.setAttribute('fill',col);
}

function handleAnswer(i,s,btn){
  if(STATE.answered)return;
  STATE.answered=true;
  clearTimer();
  STATE.totalQ++;

  document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;b.style.pointerEvents='none';});
  var av=el('avDisplay');

  if(i===s.c){
    STATE.score++;
    if(btn)btn.classList.add('correct');
    el('fbBox').innerHTML='<div class="fb-box good">'+s.fb+'</div>';
    STATE.candleH=Math.max(0.1,STATE.candleH-0.07);
    av.style.animation='bounceUp 0.6s ease';
    setTimeout(function(){av.style.animation='';},700);
    playChime(true);
    showNext();
  } else {
    if(btn)btn.classList.add('wrong');
    var btns=document.querySelectorAll('.ans-btn');
    setTimeout(function(){if(btns[s.c])btns[s.c].classList.add('correct');},500);
    el('fbBox').innerHTML='<div class="fb-box bad">'+(i===-1?'<strong>Time\'s up!</strong> ':'')+s.wfb+'</div>';
    STATE.candleH=Math.max(0.08,STATE.candleH-0.22);
    av.style.animation='shake 0.5s ease';
    setTimeout(function(){av.style.animation='';},600);
    playChime(false);
    updateFlameUI();
    el('liveCandle').innerHTML=liveFlame(CANDLES[STATE.curCandle].color,STATE.candleH);

    if(STATE.candleH<=0.28&&!STATE.rescueUsed){
      setTimeout(showRescue,1300);
    } else {
      showNext();
    }
  }
  updateFlameUI();
  el('liveCandle').innerHTML=liveFlame(CANDLES[STATE.curCandle].color,STATE.candleH);
}

function showNext(){
  var nb=el('nextBtn');nb.style.display='block';
  nb.textContent=STATE.curStep>=STATE.curPath.steps.length-1?'Reach the end organ \u2192':'Continue deeper \u2192';
}

function updateFlameUI(){
  var pct=Math.round(STATE.candleH*100);
  var fill=el('flameFill'),pctEl=el('flamePct');
  if(!fill||!pctEl)return;
  fill.style.width=pct+'%';
  fill.style.background=STATE.candleH>0.5?'#c8902a':STATE.candleH>0.25?'#aa6010':'#881000';
  pctEl.textContent=pct+'%';
}

function showRescue(){
  STATE.rescueUsed=true;
  playDrone(true);
  var rq=RESCUE[STATE.rescueIdx];
  el('rescueQ').textContent=rq.q;
  var opts=el('rescueOpts');opts.innerHTML='';
  rq.o.forEach(function(o,i){
    var b=ce('button','rescue-opt',o);
    b.addEventListener('click',function(){
      document.querySelectorAll('.rescue-opt').forEach(function(x){x.disabled=true;x.style.pointerEvents='none';});
      if(i===rq.c){
        b.classList.add('correct');
        el('rescueFb').textContent=rq.fb;
        STATE.candleH=Math.min(1.0,STATE.candleH+0.5);
        playChime(true);
      } else {
        b.classList.add('wrong');
        var obts=document.querySelectorAll('.rescue-opt');
        if(obts[rq.c])obts[rq.c].classList.add('correct');
        el('rescueFb').textContent='Not quite. '+rq.fb;
        STATE.candleH=Math.min(1.0,STATE.candleH+0.25);
      }
      updateFlameUI();
      el('liveCandle').innerHTML=liveFlame(CANDLES[STATE.curCandle].color,STATE.candleH);
      el('rescueCont').style.display='inline-block';
      playDrone(false);
      playAmbient(CANDLES[STATE.curCandle].mood);
    });
    opts.appendChild(b);
  });
  el('rescueFb').textContent='';
  el('rescueCont').style.display='none';
  el('rescueOverlay').classList.add('show');
}

function rescueContinue(){
  el('rescueOverlay').classList.remove('show');
  STATE.answered=false;
  var s=STATE.curPath.steps[STATE.curStep];
  el('fbBox').innerHTML='';
  el('nextBtn').style.display='none';
  var al=el('ansList');al.innerHTML='';
  s.o.forEach(function(opt,i){
    var b=ce('button','ans-btn',opt);
    b.style.animation='slideUp 0.35s '+(i*0.09)+'s ease both';
    b.addEventListener('click',function(){handleAnswer(i,s,b);});
    al.appendChild(b);
  });
  startTimer(s);
}

function nextStep(){
  STATE.curStep++;
  if(STATE.curStep>=STATE.curPath.steps.length){endGame();return;}
  renderStep();
}

// ══════════════════════════════════════════
// END
// ══════════════════════════════════════════
function endGame(){
  stopMusic();
  var E=el('pg-end');
  E.innerHTML=
    '<div class="end-brand">Finite by Design</div>'
    +'<div class="end-title">Pathway complete.</div>'
    +'<div class="end-sub">The candle burned to its end.</div>'
    +'<div class="end-score" id="endScore"></div>'
    +'<div class="end-score-lbl">correct on first attempt</div>'
    +'<div class="end-grid" id="endGrid"></div>'
    +'<div class="share-box" id="shareBox">Tap to copy your result and share with classmates</div>'
    +'<button class="end-btn" onclick="goHome()">Try another pathway</button>';

  el('endScore').textContent=STATE.score+'/'+STATE.totalQ;

  var eg=el('endGrid');
  PATHWAYS.forEach(function(p,i){
    var c=ce('div','end-card');
    c.style.animationDelay=(i*0.14)+'s';
    c.innerHTML='<div class="end-card-g">'+CANDLES[i].ganglion+'</div><div class="end-card-e">'+p.summary+'</div>';
    eg.appendChild(c);
  });

  var shareText='Finite by Design \u2014 '+CANDLES[STATE.curCandle].ganglion+'\nScore: '+STATE.score+'/'+STATE.totalQ+'\nParasympathetic Pathways Game';
  el('shareBox').addEventListener('click',function(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(shareText).then(function(){el('shareBox').textContent='Copied!';});
    }
  });

  show('pg-end');
  playAmbient('landing');
}

function goHome(){
  stopMusic();
  STATE.curCandle=-1;STATE.curAvatar=0;
  buildLanding();
  show('pg-landing');
}

// ══════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════
window.addEventListener('load',function(){
  buildLanding();
  show('pg-landing');
});
</script>
</body>
